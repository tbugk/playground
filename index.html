<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复利模拟器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
  .card { max-width: 640px; margin: 0 auto; background: #1e293b; border-radius: 16px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  h1 { font-size: 22px; margin-bottom: 6px; color: #7dd3fc; }
  .sub { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
  .row { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 140px; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
  input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 16px; }
  input:focus { outline: none; border-color: #7dd3fc; }
  button { width: 100%; padding: 12px; margin-top: 6px; border: none; border-radius: 10px; background: #0ea5e9; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:active { background: #0284c7; }
  .result { margin-top: 20px; padding: 16px; background: #0f172a; border-radius: 12px; display: none; }
  .result.show { display: block; }
  .big { font-size: 30px; font-weight: 700; color: #fbbf24; margin: 4px 0 14px; }
  .line { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0; border-bottom: 1px dashed #1e293b; }
  .line span:last-child { color: #7dd3fc; font-weight: 600; }
  table { width: 100%; margin-top: 14px; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 4px; text-align: right; border-bottom: 1px solid #1e293b; }
  th { color: #94a3b8; font-weight: 500; }
  td:first-child, th:first-child { text-align: left; }
</style>
</head>
<body>
<div class="card">
  <h1>💰 复利模拟器</h1>
  <p class="sub">爱因斯坦说复利是世界第八大奇迹。改改数字，看看时间怎么帮你赚钱。</p>
  <div class="row">
    <div class="field"><label>起始年龄</label><input id="startAge" type="number" value="17"></div>
    <div class="field"><label>每月投入（元）</label><input id="monthly" type="number" value="300"></div>
  </div>
  <div class="row">
    <div class="field"><label>年化收益率 %</label><input id="rate" type="number" value="7" step="0.5"></div>
    <div class="field"><label>算到几岁</label><input id="endAge" type="number" value="60"></div>
  </div>
  <button onclick="run()">开始模拟</button>
  <div class="result" id="result">
    <div class="line"><span>最终总资产</span><span></span></div>
    <div class="big" id="total"></div>
    <div class="line"><span>你实际投入的本金</span><span id="principal"></span></div>
    <div class="line"><span>复利帮你赚的（利息的利息）</span><span id="profit"></span></div>
    <div class="line"><span>收益是本金的</span><span id="ratio"></span></div>
    <table id="table"></table>
  </div>
</div>
<script>
function fmt(n){ return "¥" + Math.round(n).toLocaleString("zh-CN"); }
function run(){
  var s = +document.getElementById("startAge").value;
  var m = +document.getElementById("monthly").value;
  var r = +document.getElementById("rate").value / 100;
  var e = +document.getElementById("endAge").value;
  var i = r / 12, months = (e - s) * 12;
  var total = 0, principal = 0, rows = [];
  for (var k = 1; k <= months; k++){
    total = total * (1 + i) + m;
    principal += m;
    if (k % 12 === 0) rows.push([s + k/12 + " 岁", principal, total]);
  }
  document.getElementById("total").textContent = fmt(total);
  document.getElementById("principal").textContent = fmt(principal);
  document.getElementById("profit").textContent = fmt(total - principal);
  document.getElementById("ratio").textContent = (total / principal).toFixed(1) + " 倍";
  var html = "<tr><th>年龄</th><th>累计本金</th><th>账户总值</th></tr>";
  rows.forEach(function(row){
    html += "<tr><td>" + row[0] + "</td><td>" + fmt(row[1]) + "</td><td>" + fmt(row[2]) + "</td></tr>";
  });
  document.getElementById("table").innerHTML = html;
  document.getElementById("result").classList.add("show");
}
run();
</script>
</body>
</html>
